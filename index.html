<html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會考試題變了，教學怎麼調整（115 會考數學・臺南市）（分享版）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
/* Layout: 固定一屏的書。桌機兩頁跨頁、窄螢幕單頁；左右翻頁（3D 翻頁），頁內不捲動，內容依頁面大小自動縮放 */
:root{
  --desk:#e3e4ea;        /* 桌面 */
  --paper:#fcfbf8;       /* 書頁 */
  --paper2:#f4f2ee;
  --board:#232a3d;       /* 黑板綠 */
  --board-ink:#eceef5;
  --ink:#1c2130;
  --ink2:#4f5668;
  --ink3:#838899;
  --line:#dcdde5;
  --accent:#b4532f;
  --accent-soft:#f6e3da;
  --chalk:#3d6fb0;
  --chalk-soft:#e2ebf7;
  --before:#6b6f80;
  --gutter-shade:rgba(28,33,48,.13);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0e1017;--paper:#1b1e27;--paper2:#20232d;--board:#11141d;--board-ink:#dfe9e3;--ink:#e4ece7;--ink2:#a9bab2;--ink3:#7a8c84;--line:#2b3a34;
  --accent:#e8916b;--accent-soft:#3b2519;--chalk:#7fa8e0;--chalk-soft:#1d2a3d;--before:#d48f7c;--gutter-shade:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0e1017;--paper:#1b1e27;--paper2:#20232d;--board:#11141d;--board-ink:#dfe9e3;--ink:#e4ece7;--ink2:#a9bab2;--ink3:#7a8c84;--line:#2b3a34;
  --accent:#e8916b;--accent-soft:#3b2519;--chalk:#7fa8e0;--chalk-soft:#1d2a3d;--before:#d48f7c;--gutter-shade:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);margin:0;display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px;border-radius:6px}

.top{flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px));}
.top .brand{font-family:var(--f-display);font-weight:900;font-size:17px;white-space:nowrap}
.top .brand b{color:var(--accent)}
.top .chap{flex:1;text-align:center;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pn{font-family:var(--f-mono);font-size:13px;color:var(--ink3);white-space:nowrap}

#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#book{position:relative;perspective:2800px;filter:drop-shadow(0 14px 28px rgba(22,37,31,.22))}
.slot,.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.slot.L{left:0}.slot.R{left:var(--pw)}
#book.single .slot.R{display:none}
.leaf{transform-style:preserve-3d;z-index:5;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s}
.leaf.go .face.front .shade{opacity:1;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.18))}
.leaf.go .face.back .shade{opacity:1;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.14))}

/* page */
.pg{position:absolute;inset:0;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;
  --u:calc(var(--pw-n) / 680);font-size:calc(15.5px * var(--u) * var(--fs,1))}
.pg.l{border-radius:10px 2px 2px 10px}
.pg.r{border-radius:2px 10px 10px 2px}
.pg.s{border-radius:10px}
.pg.l::after,.pg.r::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(270deg,var(--gutter-shade),transparent)}
.pg.r::after{left:0;background:linear-gradient(90deg,var(--gutter-shade),transparent)}
.pg.l::before,.pg.r::before{content:"";position:absolute;top:0;bottom:0;width:5px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2.5px);opacity:.8}
.pg.l::before{left:0}.pg.r::before{right:0}
.run{flex:none;display:flex;justify-content:space-between;align-items:center;padding:1.15em 2.2em .2em;font-size:.72em;color:var(--ink3);font-weight:700;letter-spacing:.05em}
.run .rn{font-family:var(--f-mono);color:var(--chalk)}
.pg.r .run{flex-direction:row-reverse}
.body{flex:1;min-height:0;padding:.6em 2.2em .4em;display:flex;flex-direction:column;gap:.8em;overflow:hidden}
.folio{flex:none;text-align:center;font-family:var(--f-mono);font-size:.72em;color:var(--ink3);padding:.2em 0 1em}
.pg.l .folio{text-align:left;padding-left:2.2em}.pg.r .folio{text-align:right;padding-right:2.2em}

/* opener */
.op-no{font-family:var(--f-mono);font-weight:600;color:var(--chalk);letter-spacing:.12em;font-size:.9em}
.op-name{font-family:var(--f-display);font-weight:900;font-size:2.15em;line-height:1.18;text-wrap:balance;margin:.05em 0 0}
.op-meta{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.date{font-family:var(--f-mono);font-weight:600;background:var(--chalk-soft);border-radius:999px;padding:.15em .8em;font-size:.82em;white-space:nowrap}
.state{font-size:.78em;font-weight:900;color:var(--before);border:1px solid currentColor;border-radius:999px;padding:.05em .7em}
.op-sub{color:var(--ink2);font-size:1.02em;line-height:1.6}
.rule{height:.32em;width:5.5em;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--chalk));flex:none}

/* message bubbles */
.msg{border-radius:.8em;padding:.75em .95em;font-size:.94em;line-height:1.68;position:relative}
.msg .who{font-size:.76em;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;gap:.5em;margin-bottom:.3em}
.msg.t{background:var(--chalk-soft);border:1px solid color-mix(in srgb,var(--chalk) 40%,transparent)}
.msg.a{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.msg.a .who{color:var(--accent)}
.msg .badge{font-weight:700;font-size:.92em;letter-spacing:0;padding:0 .55em;border-radius:99px;border:1px solid currentColor;opacity:.75}
.msg pre{white-space:pre-wrap;font-family:var(--f-body);margin:0}
.msg ul,.msg ol{margin:.15em 0 0;padding-left:1.2em}.msg li{margin:.1em 0}
.copy{position:absolute;top:.55em;right:.6em;font-size:.72em;font-weight:900;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.05em .7em}
.why{border-left:.28em solid var(--chalk);padding:.15em 0 .15em .8em;color:var(--ink2);font-size:.95em;line-height:1.65}
.why b{color:var(--ink)}
.note{font-size:.8em;color:var(--ink3);border-top:1px dashed var(--line);padding-top:.5em}
.h3{font-family:var(--f-display);font-weight:900;font-size:1.3em}

/* image page */
.figp{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7em;justify-content:center}
.shot{flex:0 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.figp .shot img{max-height:calc(var(--ph) * .68)}
.hero .shot{flex:1}
.shot img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:.45em;border:1px solid var(--line);box-shadow:0 2px 10px rgba(22,37,31,.08);background:#fff}
.tag{position:absolute;left:0;top:0;font-weight:900;font-size:.8em;padding:.15em .8em;border-radius:999px;background:var(--accent);color:var(--paper);z-index:1}
.tag.before{background:var(--before)}
.cap{flex:none;font-size:.92em;line-height:1.62;color:var(--ink2)}
.cap b{color:var(--ink)}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8em}
.stack{justify-content:center}.stack .cell{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:.35em}.stack .shot img{max-height:calc(var(--ph) * .3)}
.stack .cap{font-size:.86em}

/* cover */
.cov{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.9em;padding:0 2.6em}
.cov .k{font-family:var(--f-mono);font-size:.85em;letter-spacing:.14em;color:var(--accent);font-weight:600}
.cov h1{font-family:var(--f-display);font-weight:900;font-size:4.2em;line-height:1.08;margin:0;letter-spacing:.02em}
.cov h1 span{display:block;font-size:.66em;color:var(--accent)}
.cov .chalkline{height:.55em;width:9em;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--chalk))}
.cov p{font-size:1.08em;color:var(--ink2);line-height:1.75;margin:0}
.cov p b{color:var(--accent)}
.cov .who{margin-top:1.2em;border-top:1px solid var(--line);padding-top:.9em;font-weight:900;font-size:1.1em}
.cov .who em{font-style:normal;color:var(--chalk);margin:0 .35em}
.cov .who small{display:block;font-size:.75em;color:var(--ink2);font-weight:700}
.hero{background:var(--board);border-radius:1em;padding:.8em;flex:1;min-height:0;display:flex;flex-direction:column;gap:.5em}
.hero .shot img{border:0}
.hero .hc{color:var(--board-ink);font-size:.8em;display:flex;justify-content:space-between;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em;flex:none}
.fact{border:1px solid var(--line);border-radius:.8em;padding:.55em .75em;min-width:0}
.fact .k{font-size:.7em;color:var(--ink3);letter-spacing:.3em;font-weight:900}
.fact .v{font-family:var(--f-display);font-weight:900;font-size:1.3em;line-height:1.25}
.fact .s{font-size:.72em;color:var(--ink2);font-weight:700}

/* toc */
.toc{display:flex;flex-direction:column;gap:.15em;flex:1;min-height:0}
.toc button{display:grid;grid-template-columns:4.4em 1fr auto;align-items:baseline;gap:.6em;border:0;background:none;text-align:left;padding:.42em .2em;border-bottom:1px dotted var(--line);border-radius:0}
.toc button:hover{background:var(--accent-soft)}
.toc .no{font-family:var(--f-mono);font-size:.78em;color:var(--chalk);font-weight:600}
.toc .nm{font-weight:900;font-size:1.02em;line-height:1.35}
.toc .nm small{display:block;font-weight:700;font-size:.74em;color:var(--ink3)}
.toc .p{font-family:var(--f-mono);font-size:.8em;color:var(--ink2)}
.toc .sec{font-size:.74em;font-weight:900;letter-spacing:.2em;color:var(--accent);margin-top:.5em}

/* misc blocks */
.flow{display:flex;flex-direction:column;gap:.5em}
.flowlab{font-family:var(--f-mono);font-size:.75em;color:var(--ink3)}
.flowrow{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.node{border:2px solid var(--line);background:var(--paper);border-radius:.6em;padding:.3em .7em;font-weight:900;font-size:.95em}
.node.v{border-color:var(--accent);color:var(--accent)}
.ar{color:var(--ink3);font-weight:900}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.num{border:1px solid var(--line);border-radius:.8em;padding:.5em .8em}
.num b{display:block;font-family:var(--f-display);font-size:2em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.num span{font-size:.8em;color:var(--ink2);font-weight:700}
.habit{border-bottom:1px solid var(--line);padding:.55em 0}
.habit h4{margin:0;font-size:1.08em;font-weight:900;display:flex;gap:.6em;align-items:baseline}
.habit h4 span{font-family:var(--f-mono);color:var(--chalk);font-size:.85em}
.habit p{margin:.25em 0 0;color:var(--ink2);font-size:.93em;line-height:1.6}
.habit .from{font-size:.75em;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:.35em .4em;text-align:left;vertical-align:top}
.tbl th{font-size:.85em;color:var(--ink3)}
.backc{flex:1;background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1em;text-align:center;padding:2em}
.backc .t{font-family:var(--f-display);font-weight:900;font-size:2.4em}
.backc p{opacity:.85;line-height:1.8;margin:0}
.backc .chalk{color:var(--chalk);font-weight:900}

/* edge hot zones */
.hot{position:absolute;top:0;bottom:0;width:7%;z-index:8;cursor:pointer}
.hot.prev{left:-3%}.hot.next{right:-3%}
.hot::after{content:"";position:absolute;top:50%;width:1.8em;height:1.8em;margin-top:-.9em;border-radius:50%;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}
.hot.prev::after{left:15%}.hot.next::after{right:15%}
.hot:hover::after{opacity:.9}
.corner{position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 34px 34px;border-color:transparent transparent var(--paper2) transparent;filter:drop-shadow(-2px -2px 2px rgba(0,0,0,.12));z-index:7;pointer-events:none;transition:border-width .2s}
#book:hover .corner{border-width:0 0 46px 46px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:rgba(10,18,15,.93);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#lb .bar{display:flex;justify-content:space-between;align-items:center;color:#e9f0eb;gap:12px;padding-bottom:8px;font-weight:700;font-size:14px}
#lb .bar button{background:#e9f0eb;color:#16251f;border:0;border-radius:99px;padding:4px 14px;font-weight:900}
#lb .sc{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;transition:transform .06s linear;touch-action:none;user-select:none;-webkit-user-drag:none}
#lb .lbzw{display:flex;gap:8px;align-items:center}
#lb .lbzw input[type=range]{width:min(340px,38vw);height:28px;accent-color:#e9f0eb;cursor:pointer}
#lb .lbzw output{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
#lb .lbzw #lbm,#lb .lbzw #lbp{width:34px;padding:4px 0;font-size:17px}

/* dock + whiteboard */
#dock{flex:none;display:flex;justify-content:center;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:50}
.tb{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 18px rgba(22,37,31,.12);border-radius:999px;padding:5px 8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.tb button{border:1px solid var(--line);background:var(--paper);border-radius:999px;min-width:36px;height:36px;padding:0 11px;font-weight:900;font-size:14px}
.tb button.ff{font-size:15px;padding:0 9px;min-width:44px;font-variant-numeric:tabular-nums}
.tb button.stop{background:var(--before);color:var(--paper);border-color:var(--before);min-width:78px}
body.ffing #dock{opacity:1!important;pointer-events:auto!important}
.tb button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.tb .pg-n{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink2);min-width:64px;text-align:center}
.tb .sep{width:1px;height:22px;background:var(--line)}
.tb .sw{min-width:24px;width:24px;height:24px;padding:0;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.tb .sw.on{box-shadow:0 0 0 3px var(--ink)}
.tb input[type=range]{width:70px;accent-color:var(--accent)}
#wbtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#wb{position:fixed;inset:0;z-index:40;touch-action:none;cursor:crosshair}
#pen{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent);color:var(--paper);font-size:22px;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:51}
@media (max-width:640px){.top .brand{display:none}.tb .lbl{display:none}}
/* 橫式寬頁（單頁＋橫向螢幕）：圖左、說明右；文字欄限寬置中 */
.pg.wide .body{padding-left:max(2.2em,calc((100% - 52em)/2));padding-right:max(2.2em,calc((100% - 52em)/2))}
.pg.wide .body:has(> .figp),.pg.wide .body:has(> .stack){padding-left:1.6em;padding-right:1.6em}
.pg.wide .figp{flex-direction:row;align-items:center;gap:1.4em}
.pg.wide .figp .shot{flex:1 1 auto;min-width:0;height:100%}
.pg.wide .figp .shot img{max-height:calc(var(--ph) * .86)}
.pg.wide .figp .cap{flex:0 0 22%;font-size:1em}
.pg.wide .stack .shot img{max-height:calc(var(--ph) * .34)}
.pg.wide .run,.pg.wide .folio{padding-left:1.6em;padding-right:1.6em}
.pg.wide .cov{padding:0 max(2.6em,calc((100% - 40em)/2))}
/* 滿版 */
body.fill .top{display:none}
@media (max-height:520px){.top{display:none}}
body.fill #stage{padding:0;align-items:flex-start}
/* 滿版時工具列透明：平常完全隱形、不擋內容；滑到螢幕底部或點底部才出現，出現時也是透明底 */
body.fill #dock,body.short #dock{position:fixed;left:0;right:0;bottom:0;opacity:0;pointer-events:none;transition:opacity .25s}
body.fill #dock.show,body.short #dock.show,body.fill #dock:has(:focus-visible),body.short #dock:has(:focus-visible){opacity:1;pointer-events:auto}
body.fill .tb,body.short .tb{background:transparent;border-color:transparent;box-shadow:none}
body.fill .tb button,body.short .tb button{background:color-mix(in srgb,var(--paper) 55%,transparent);border-color:color-mix(in srgb,var(--line) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.fill .tb button.on,body.short .tb button.on{background:color-mix(in srgb,var(--accent) 80%,transparent);color:var(--paper)}
body.fill .tb .pg-n,body.short .tb .pg-n{background:color-mix(in srgb,var(--paper) 55%,transparent);border-radius:999px;padding:6px 8px;backdrop-filter:blur(6px)}
body.fill .tb .sep,body.short .tb .sep{background:transparent}
.tb button.mode{min-width:64px}
@media (prefers-reduced-motion:reduce){.leaf{transition:none!important}}
/* ===== 研習電子書擴充 ===== */
:root{--c-indigo:#4a3fd6;--c-red:#d43c3c;--c-orange:#b4532f;--c-green:#0f7a5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-indigo:#958dff;--c-red:#ff7d7d;--c-orange:#e8916b;--c-green:#4cc49a}}
:root[data-theme="dark"]{--c-indigo:#958dff;--c-red:#ff7d7d;--c-orange:#e8916b;--c-green:#4cc49a}
.opx{font-size:.78em;font-weight:900;color:#fff;background:#0f7a5a;border-radius:999px;padding:.12em .85em;white-space:nowrap}
.h3row{display:flex;align-items:center;justify-content:space-between;gap:.6em;flex-wrap:wrap;flex:none}
.stats{display:flex;flex-direction:column;gap:.35em}
.stat{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.45fr);align-items:center;gap:.9em;border-bottom:1px solid var(--line);padding:.4em 0}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:2.45em;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .k{font-size:.72em;letter-spacing:.2em;font-weight:900;color:var(--ink3)}

.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}

.steps li::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--chalk);color:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:.88em;margin-top:.12em}

.cards{display:flex;flex-direction:column;gap:.6em}
.card{border:1px solid var(--line);border-radius:.8em;padding:.6em .9em;background:var(--paper)}
.card h4{margin:0;font-size:1.05em;font-weight:900}
.card p{margin:.2em 0 .25em;color:var(--ink2);font-size:.9em;line-height:1.55}
.card a{font-family:var(--f-mono);font-size:.76em;color:var(--chalk);word-break:break-all;text-decoration:none}
.svgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.svgwrap svg{width:100%;height:100%}
.flowrow .node{font-size:.9em}
.msg.t .who{color:var(--chalk)}
.big-quote{font-family:var(--f-display);font-weight:900;font-size:1.5em;line-height:1.5;border-left:.25em solid var(--accent);padding-left:.7em}
.pg{font-size:calc(19px * var(--u) * var(--fs,1))}
@media (max-width:640px){.pg{font-size:calc(27px * var(--u) * var(--fs,1))}.cov h1{font-size:3.2em}}
/* ===== 講師版：備註、投影、計時器 ===== */
.tnote{border:1.5px dashed var(--accent);border-radius:.6em;padding:.45em .75em;font-size:.82em;line-height:1.55;color:var(--ink2);background:color-mix(in srgb,var(--accent-soft) 55%,transparent);flex:none}
.tnote b{color:var(--accent);margin-right:.5em}
body.proj .tnote{display:none}
#tmr{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:92px;z-index:56;width:310px;max-width:calc(100vw - 32px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 14px 14px;font-family:var(--f-body)}
.tm-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:900}

.tm-d{font-family:var(--f-mono);font-size:56px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px}
.tm-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:7px;align-items:center;font-size:13px;color:var(--ink2);font-weight:700}
.tm-row button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13px}
.tm-row button.main{background:var(--accent);color:var(--paper);border-color:var(--accent);min-width:84px}
.tm-row button.tmpg{border-color:var(--c-green);color:var(--c-green)}
.tm-row input{width:58px;padding:5px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:900;text-align:center;background:var(--paper);color:var(--ink)}
.tm-warn{color:#d9773f}.tm-done{color:#e04848;animation:tmblink 1s steps(2) infinite}
@keyframes tmblink{50%{opacity:.2}}
#tmBigView{position:fixed;inset:0;z-index:70;background:#11141d;color:#eceef5;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
#tmBigD{font-family:var(--f-mono);font-weight:600;font-size:min(30vw,60vh);line-height:1;font-variant-numeric:tabular-nums;cursor:pointer}

.tm-bh{position:absolute;bottom:22px;font-size:15px;opacity:.5;text-align:center;padding:0 16px}
#tmChip{position:fixed;top:10px;right:14px;z-index:57;font-family:var(--f-mono);font-weight:600;font-size:22px;background:#11141d;color:#eceef5;border-radius:999px;padding:4px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* ===== 分享版：隱藏頁（看講師投影＋筆記） ===== */
.hidcard{border:2px dashed var(--chalk);border-radius:.9em;padding:1.1em 1em;text-align:center;background:var(--chalk-soft);flex:none}
.hidcard p{margin:.35em 0 0;color:var(--ink2)}
.hidk{font-family:var(--f-display);font-weight:900;font-size:1.35em;color:var(--chalk)}
.hidl{font-size:.8em;font-weight:900;color:var(--ink3);flex:none}
.memo{width:100%;flex:1;min-height:5em;border:1px solid var(--line);border-radius:.6em;padding:.6em .7em;font:inherit;font-size:.95em;line-height:1.6;background:var(--paper);color:var(--ink);resize:none}

/* ===== 互動：本頁互動按鈕、學員作答連結 ===== */
.actpill{flex:none;align-self:flex-start;border:1.5px solid var(--c-green);color:var(--c-green);background:color-mix(in srgb,var(--c-green) 8%,transparent);border-radius:999px;padding:.25em .9em;font-weight:900;font-size:.8em;text-align:left;cursor:pointer}
.actlink{flex:none;align-self:flex-start;display:inline-block;border-radius:999px;padding:.4em 1em;background:var(--c-green);color:#fff;font-weight:900;font-size:.9em;text-decoration:none}
/* ===== 講師版：投影視窗、互動面板與投影畫面 ===== */
body.aud #dock,body.aud .top,body.aud #pen,body.aud #tmChip,body.aud #tmBigX,body.aud .tm-bh{display:none!important}
body.aud #stage{padding:0}
body.proj .actpill,body.aud .actpill{display:none!important}
#audToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#11141d;color:#eceef5;padding:12px 20px;border-radius:999px;font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center}
#actp{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:92px;z-index:56;width:390px;max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 14px 14px;font-family:var(--f-body);font-size:14px}
#actp .acc{flex:1;text-align:right;margin-right:8px;font-size:12px;color:var(--ink3);font-weight:700}
.ap-h{font-size:12px;font-weight:900;color:var(--ink3);margin:8px 0 4px;letter-spacing:.1em}
.ap-it{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 10px;margin:4px 0;font-weight:700;font-size:13px;line-height:1.4}
.ap-it.on{border-color:var(--accent);background:var(--accent-soft)}
.ap-it.live::after{content:" ● 作答中";color:#d43c3c;font-weight:900}
.ap-more summary{cursor:pointer;font-size:12px;font-weight:900;color:var(--ink3);margin:8px 0 2px}
.ap-sel{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.ap-q{font-weight:900;font-size:15px;line-height:1.5}
.ap-meta{font-size:12px;color:var(--ink2);margin-top:4px}
.ap-meta .live{color:#d43c3c}
.ap-note{font-size:13px;line-height:1.6;color:var(--ink2);margin:6px 0}
.ap-url{font-family:var(--f-mono);font-size:11px;word-break:break-all;color:var(--chalk)}
.ap-res{margin-top:10px}
.tm-row button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vbars{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(3em,auto) 1fr auto;gap:8px;align-items:center;font-weight:900;font-size:13px}
.vt{height:14px;background:var(--paper2);border-radius:99px;overflow:hidden}
.vf{display:block;height:100%;background:var(--c-indigo);border-radius:99px;transition:width .5s}
.vn{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.vbars.big{gap:2.2vh}.vbars.big .vrow{font-size:max(22px,3.2vh);gap:1.4vw}
.vbars.big .vt{height:max(26px,4.2vh)}.vbars.big .vn{font-size:max(18px,2.6vh)}
.wcloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.2em .6em;font-weight:900;line-height:1.25;font-size:13px}
.wcloud.big{font-size:max(18px,2.6vh);gap:.3em .8em}
.av-empty,.av-wait{color:var(--ink3);font-weight:900;text-align:center;padding:1em}
#actView{position:fixed;inset:0;z-index:69;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:4vh 4vw;gap:3vh;font-family:var(--f-body)}
#avX{position:absolute;top:14px;right:18px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:900}
.av-q{font-family:var(--f-display);font-weight:900;font-size:max(26px,5vh);line-height:1.3;padding-right:120px}

#actView.nores .av-main{grid-template-columns:auto 1fr}
.av-join{display:flex;flex-direction:column;align-items:center;gap:1.5vh;text-align:center}
.av-qr{width:min(46vh,34vw);background:#fff;border-radius:12px;padding:8px}
.av-qr svg{width:100%;height:auto;display:block}
.av-url{font-family:var(--f-mono);font-size:max(11px,1.4vh);color:var(--ink3);word-break:break-all;max-width:min(46vh,34vw)}
.av-n{font-size:max(20px,3vh);font-weight:900;color:var(--ink2)}
.av-n b{font-family:var(--f-mono);font-size:1.6em;color:var(--accent)}
.av-n small{display:block;font-size:.6em;color:var(--ink3)}
.av-res{min-width:0;max-height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
/* ===== 講師備註抽屜 ===== */
#notep{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:92px;z-index:56;width:400px;max-width:calc(100vw - 32px);max-height:calc(100vh - 130px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px 14px 14px;font-family:var(--f-body);font-size:14px;line-height:1.6}
#notep .acc{flex:1;text-align:right;margin-right:8px;font-size:12px;color:var(--ink3);font-weight:700}
.np-tabs{display:flex;gap:6px;margin:8px 0 10px;flex-wrap:wrap}
.np-tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:900;font-size:13px}

.np-pg{border-top:1px dashed var(--line);padding:8px 0}

.np-t{font-weight:900}

.np-act{background:var(--accent-soft);color:var(--accent)}
.np-tx{color:var(--ink2)}

.np-h{font-weight:900;margin:10px 0 4px}
.np-warn{background:#fff3e0;border:1px solid #f0c27a;border-radius:10px;padding:8px 10px;font-weight:700;color:#8a5300;margin-bottom:8px}
#notep .tbl{font-size:13px}
body.proj #notep,body.aud #notep{display:none!important}
/* ===== 先猜／揭曉標記 ===== */
.mk{font-size:.78em;font-weight:900;border-radius:999px;padding:.12em .85em;white-space:nowrap}
.mk.ask{background:#fff3d6;color:#9a5a00;border:1px solid #f0c27a}
.mk.rev{background:#e3f4ec;color:#0f7a5a;border:1px solid #9fd6bd}
.echo{flex:none;font-size:.8em;color:var(--ink3);font-weight:700;border-left:.22em solid var(--line);padding-left:.6em;margin-top:-.3em}
/* ===== 滿版：善用整個版面 ===== */
.pg.wide .body{padding-left:3.2%!important;padding-right:3.2%!important}
.pg.wide .run,.pg.wide .folio{padding-left:3.2%;padding-right:3.2%}
.pg .body{padding-bottom:.8em}
.pg.wide .stat{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}
.pg .run{font-size:calc(.72em / var(--fs,1))}
.pg .folio{font-size:calc(.72em / var(--fs,1))}
.stat,.pg.wide .stat{grid-template-columns:auto minmax(0,1fr)!important;column-gap:1.1em}
.stat .v{min-width:3.2em}

.pg.wide{--u:calc(var(--pw-n) / 560)}
.pg.wide .run{font-size:calc(1.15em / var(--fs,1));justify-content:flex-start;gap:.8em;padding:1.1em 3.2% .7em;margin:0 0 .2em;border-bottom:1px solid var(--line);color:var(--ink2);flex-direction:row!important}

.sl-head{flex:none;display:flex;flex-direction:column;gap:.45em}
.sl-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.75em}
.sl-two{display:grid!important;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:2.4em;align-items:center}

.pg.wide .sl-one .stats .stat{padding:.55em 0}
.sl-foot{flex:none}
.sl-foot .note{border-top:1px dashed var(--line);padding-top:.4em;font-size:.72em}
.sl-two{grid-template-columns:none}
.sl-main,.sl-l,.sl-r{justify-content:safe center}
.sl-main{overflow:hidden}
.sl-l,.sl-r{overflow:hidden}
/* ===== 題組結果：依序揭曉 ===== */
.setres{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.setres:not(.big){grid-template-columns:1fr}

.sr-hold{font-family:var(--f-display);font-weight:900;color:var(--line);text-align:center;font-size:3em;padding:.4em 0}
.setres.big{gap:2vw;align-items:stretch;height:100%}

.setres.big .sr-col.on{opacity:1;box-shadow:0 .6em 1.8em rgba(22,37,31,.12)}
.setres.big .sr-q{font-size:max(18px,2.4vh);line-height:1.4}

 '轉變二：題組題':'111–114 年每年都有一組題組題、每組 2 題；115 年第 23～25 題變成一組 3 題。定義在文、數據在表。第 24 題臺南基礎組選 (C) 200x 最多，單位沒換。',
 '轉變三：判斷說法':'111、112 年各 3 題，113 年起 8～9 題。這類題要舉例、舉反例。口徑：長條＝官方評量目標寫著「推論」或「判斷」的題目，115 年 8 題＝7 題選擇＋非選第 27 題；平均通過率只算 7 題選擇題（第 11、14、19、20、21、22、25 題）。這 7 題都在中後段，45.3% 對 65.3% 的差也受題序與內容影響，不要說成全是題型造成。「會考演變」頁的 3 題只算題幹有【甲】【乙】的看法／作法題，範圍更窄，三個數字不衝突。',
 '第 6 題的切入點：那 10 公斤有兩個身分':'請老師先不要算，只說要劃掉哪一欄、哪一列。再比較兩種解法；排除法要記得加回交叉的 10。交叉的 10 公斤既是良級、也是大果。誘答 (A) 620＝800－80－100：沒看出 10 公斤有兩個身分，扣了兩次。(C) 700 只扣大果、(D) 720 只扣良級。',
 '第 10 題的切入點：先問每個數字是誰':'可讓老師兩人一組，先填「數字→身分」再解題。(B) 380 的推測要靠追問確認：「1100 是誰的錢？」',
 '卡在哪一級：四種分項能力':'臺南和全國幾乎一樣，所以不是臺南特有的問題。分析思考三年下滑：0.44 → 0.40 → 0.37。',
 '三個轉變 → 三個教學調整':'第一段收束，讓老師能說出三個轉變。補一句：會考不是把素養題外掛到試卷上，而是把基本技能改裝成需要翻譯的條件。另：115 年選擇題正答 B 有 8 題、A 只有 4 題（114 年為 6／7／6／6）；提醒學生用條件與單位檢查答案，不要看選項分布改答案。',
 '錯誤選項，是學生思考留下的寶藏。':'先說清楚：可能的想法只是推測。',
 '第 14 題：先猜':'開始互動 q14，約 40 秒。',
 '第 14 題：待加強組最多人選 C':'正答 B：最大值 −20。選 C 的想法不只一種，所以要追問。',
 '第 17 題：先猜':'開始互動 q17，約 40 秒。',
 '第 17 題：待加強組最多人選 C':'(C) 線性思考；(B) 年數數錯（2024～2030 是 7 次成長）。',
 '學生錯在哪一步？':'S1 圈問題、S2 拆資料、S3 建關係、S4 列式計算、S5 回情境、G 猜測。強調是 AI 反推的推測，接著用四個來源細看。',
 '迷思從哪裡來？四個來源':'這是第二段的單圖模型。接下來四頁版型固定。',
 '會考數學的答案，藏著規律嗎？':'銜接頁：點按鈕開另一本電子書（目前製作中，按鈕不能點）。看完再回來進第三段非選題。',
 '回到第 22 題：他以為＿＿＿':'開文字雲 think，約 2 分鐘；挑 2～3 句念出來，接到下一頁的①。',
 '① 舊規則過度套用：第 22 題':'可能的想法：「到兩邊距離相等 → 角平分線」，把這條規則搬到兩組<b>平行</b>的對邊上。　教學一招：給 AB≠AD 的平行四邊形實際作圖，對照角平分線交點與對角線交點；再比較菱形。　只有菱形時兩種作法才會重合；這題 AB＝20、AD＝21。',
 '② 圖形看起來像：第 16 題':'可能的想法：把 BD 當成 ∠B 的角平分線（看起來像 45°），得 180°−25°−45°＝110°。　教學一招：改畫 ∠C＝20° 的直角三角形，讓「看起來」失效；再連結「斜邊中點到三頂點等距」，得 ∠ABD＝∠A＝50°。　選 110° 的推算方式是推測，要追問確認。',
 '③ 語言與邏輯詞：第 20 題':'可能的想法：找到乙的反例後，順手認為甲也「不一定」，沒有分開驗證。　教學一招：「一定／可能／不可能」三欄分類練習；每個說法各自舉例或舉反例。　精熟組也有約三成選 B。',
 '④ 只記步驟口訣：第 7 題':'可能的想法：長除法相減時只消掉首項，沒有整列變號：−3x−8x 算成 5x，最後得商 4x＋5、餘 5，和為 4x＋10。　教學一招：相減那一列先加括號再整列變號；做完用「被除式＝除式×商式＋餘式」驗算。　(B) 已驗算：相減沒變號時，4x²−3x−5 減 4x²＋8x 得 5x−5，再減 5x＋10 得 5，商 4x＋5、餘 5；結果和除以 x−2 一樣。國中只教長除法。',
 '不是再講一遍：三招處方':'第二段收束。可在這裡休息，視現場調整。',
 '非選題：分數給的是「看得見的思考」。':'只帶過兩題的基本資料。灰色兩列是全國：臺南第 1 題平均略高（1.48 對 1.46），第 2 題略低（0.97 對 1.00），未作答都和全國差不多。',
 '這份樣卷，你給幾級分？':'開始互動 g26，約 1 分鐘。多數人會給 2 級分。',
 '官方：一級分':'這份樣卷也是「讀題迷思」的例子：15 公里讀成 15 圈。',
 '級分大致對應學生走到第幾步':'五步只是診斷用的共同架構，方便看學生停在哪；正式給分一定回到各題評分規準。「有寫」不等於得分，要留下正確、有效的解題證據。',
 '先猜：待加強組第 2 題，多少比例拿 0 分？':'開始互動 blank，約 40 秒。0 級分＝有作答但 0 級分；沒作答另列，兩者合計就是「拿 0 分」。',
 '第 1、2 題：各組有多少比例拿 0 分？':'帶看順序：① 先看待加強組第 2 題（紅字）：沒作答 69.05%＋0 級分 16.69%＝85.74%，超過八成（兩個一位小數 69.1＋16.7＝85.8，是四捨五入造成，以原始數據為準）。② 再看基礎組第 2 題沒作答 18.1%（橘字），第 1 題只有 1.6%。表格是「各組內」的百分比，只能說哪一組比例高，不能說拿 0 分的都是哪一組。待加強組第 1 題：15.72%＋34.07%＝49.79%。精熟組兩題都不到 1%。全國（全國版試題分析）：待加強組第 2 題 70.68%＋16.18%＝86.86%，第 1 題 38.62%＋15.93%＝54.55%；全體第 2 題沒作答 27.11%，和臺南 26.96% 幾乎一樣。「有效的第一步」＝寫下有用的條件、圖或式子，不是只要動筆。',
 '第 1、2 題：待加強的學生停在哪一級':'第 2 題基礎組 18.1% 未作答、67.3% 停在 1 級分；精熟組 3 級分 41.2%。全市：未作答 27.0%、0 級分 7.1%、1 級分 45.0%、2 級分 10.5%、3 級分 10.5%。第 1 題全市：未作答 9.5%、1 級分 45.8%、3 級分 24.0%。全國待加強：第 1 題未作答 38.62%、0 級分 15.93%、1 級分 35.19%、2–3 級分 10.26%；第 2 題未作答 70.68%、0 級分 16.18%、1 級分 13.09%、2–3 級分 0.04%。臺南和全國的樣子幾乎一樣。',
 '給學生的作答框架':'告訴老師：這張可以直接影印給學生。',
 '回到 116 會考的國三':'收尾不重述內容，只留一個下週就能做的動作。',
 '會考 × 篩選：提早看見':'73 條學習內容；橫軸會考題數、縱軸篩選題數。右上框是兩端都常考的 13 條，橘點是待加強組低於 0.30。重點：國三才補太晚。',
 '明天的課：關係先行＋出口卡':'出口卡用今天四題，選項就是診斷：學生選哪個，就知道卡在哪個來源。',
 '研習結束前，說說未來的作為':'開文字雲 take，挑 2～3 句念出來。請老師照四格說：看見哪個異常 → 先問什麼 → 聽到什麼回答 → 採取什麼教學動作。',
 '練一題：你會用哪一招？':'開互動 rx。沒有標準答案：(C) 適合「舉反例」（2025 年增加量和 2024 年一樣嗎？）或「換表徵」（列出逐年金額表）。重點是寫出那一句追問。'

window.__mvp=function(root,ev){
  if(ev){ ev.stopPropagation(); }
  let S=root._s; if(!S) S=root._s={t:.15,dir:1,on:false,ap:false,tr:[]};
  const q=k=>root.querySelector('[data-k="'+k+'"]');
  const draw=()=>{ const g=MVP_G(S.t), set=(k,o)=>{ const e=q(k); for(const a in o) e.setAttribute(a,o[a]); };
    set('p',{cx:g.px,cy:g.py}); set('pe',{x1:g.ex,y1:g.ey,x2:g.px,y2:g.py}); set('pf',{x1:g.fx,y1:g.fy,x2:g.px,y2:g.py});
    set('ef',{x1:g.ex,y1:g.ey,x2:g.fx,y2:g.fy}); set('ap',{x2:g.px,y2:g.py}); set('gd',{cx:g.gx,cy:g.gy});
    set('tp',{x:g.px+10,y:g.py+18}); set('te',{y:g.ey+5}); set('tf',{x:g.fx-5});
    const d=8; set('sq',{d:`M${g.ex+d} ${g.ey}V${g.ey-d}H${g.ex}M${g.fx} ${g.fy+d}H${g.fx-d}V${g.fy}`});
    S.tr.push(g.gx.toFixed(1)+' '+g.gy.toFixed(1)); if(S.tr.length>400) S.tr.shift(); set('tr',{d:'M'+S.tr.join('L')});
    q('rd').textContent='BP＝'+g.bp.toFixed(2)+'　EF＝'+g.ef.toFixed(2)+(S.ap?'　AP＝'+g.ef.toFixed(2):'');
    q('hint').textContent=S.on?'點一下暫停':'▶ 點一下開始';
    root.classList.toggle('on',S.on); root.classList.toggle('apon',S.ap);
    const pb=root.querySelector('[data-a="play"]'); if(pb) pb.textContent=S.on?'⏸ 暫停':'▶ 播放';
    const ab=root.querySelector('[data-a="ap"]'); if(ab) ab.textContent=S.ap?'藏起 AP':'畫出 AP';
    const fb=root.querySelector('[data-a="fs"]'); if(fb) fb.textContent=S.fs?'✕ 縮小（Esc）':'⛶ 全螢幕'; };
  const b=ev&&ev.target.closest&&ev.target.closest('button'), a=b?b.dataset.a:'play';
  const fsWant=a==='fs'?((ev&&'__fs' in ev)?!!ev.__fs:!S.fs):!!S.fs;
  if(!(ev&&ev.__cast) && window.__post && !(typeof IS_AUD!=='undefined'&&IS_AUD)) window.__post({t:'mvp',a,on:a==='play'?!S.on:S.on,fs:fsWant});
  if(a==='fs'){ __mvpFS(root,fsWant,ev&&ev.__cast); draw(); return; }   /* 投影視窗同步 */
  if(a==='ap'){ S.ap=!S.ap; draw(); return; }
  if(a==='reset'){ S.t=0; S.dir=1; S.tr=[]; draw(); return; }
  S.on=!S.on;
  if(S.on){ let last=performance.now(); const step=now=>{ if(!S.on) return; if(!root.isConnected){ S.on=false; return; }
      const dt=Math.min(.1,(now-last)/1000); last=now; S.t+=S.dir*dt/14;   /* 單程 14 秒 */
      if(S.t>=1){ S.t=1; S.dir=-1; } if(S.t<=0){ S.t=0; S.dir=1; } draw(); requestAnimationFrame(step); };
    requestAnimationFrame(step); }
  draw();
};

window.__mvpFS=function(root,on,cast){ const S=root._s; S.fs=on;
  if(on){ if(root._ov) return; window.__bzClose&&window.__bzClose();
    const ph=document.createComment('mvp'); root.parentNode.insertBefore(ph,root); root._ph=ph;
    const ov=document.createElement('div'); ov.className='x-mvp-ov'; document.body.appendChild(ov); ov.appendChild(root); root._ov=ov;
    if(!cast && !document.fullscreenElement && ov.requestFullscreen) ov.requestFullscreen().then(()=>{ root._fsr=1; }).catch(()=>{});
  } else { const ov=root._ov, ph=root._ph; root._ov=root._ph=null;
    if(ph&&ph.parentNode){ ph.parentNode.insertBefore(root,ph); ph.remove(); } else root.remove();   /* 原頁已重畫：舊圖丟掉，動畫自動停 */
    if(root._fsr && document.fullscreenElement===ov) document.exitFullscreen().catch(()=>{}); root._fsr=0; ov&&ov.remove(); } };

/* ---------- 頁面製作規定：算式不可被換行切斷（自動把算式包成不換行的單位） ---------- */
(function(){
  const M='A-Za-z0-9()（）＋+−＝=×÷²³√.∥∠△°≤≥⊥′';
  const RUN=new RegExp(`[${M}]+(?:(?:, | |：)[${M}]+)*`,'g');
  const OP=/[＋+−＝=×÷≤≥∥⊥：²³√]/;
  const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','SVG','svg','BUTTON','INPUT','SELECT','PRE','CODE']);
  const INL=new Set(['I','SUB','SUP','EM']);
  const ok=t=>{ t=t.trim(); return t.length>=3 && t.length<=30 && OP.test(t) && /[A-Za-z0-9]/.test(t); };
  function group(el){
    const kids=[...el.childNodes]; let g=[];
    const flush=()=>{ if(g.length) wrapGroup(g); g=[]; };
    kids.forEach(n=>{
      if(n.nodeType===3 || (n.nodeType===1 && INL.has(n.tagName) && !n.querySelector('*'))) g.push(n);
      else { flush(); if(n.nodeType===1 && !SKIP.has(n.tagName) && !(n.classList&&n.classList.contains('eq'))) group(n); }
    });
    flush();
  }
  function wrapGroup(nodes){
    let text='', map=[];
    nodes.forEach(n=>{ const t=n.textContent; map.push([n,text.length,text.length+t.length]); text+=t; });
    if(!OP.test(text)) return;
    const runs=[]; let m; RUN.lastIndex=0;
    while((m=RUN.exec(text))){ let s=m.index, e=s+m[0].length; while(text[s]===' ') s++; while(e>s && text[e-1]===' ') e--;
      const lab=/^(?:\d+|[A-Z])：(?=[A-Za-z(（−√∠])/.exec(text.slice(s,e)); if(lab) s+=lab[0].length;
      const bal=()=>{ const t=text.slice(s,e); return [(t.match(/[（(]/g)||[]).length,(t.match(/[）)]/g)||[]).length]; };
      for(let g=0;g<3;g++){ const [o,c]=bal(); if(o>c && /[（(]/.test(text[e-1])) e--; else if(c>o && /[）)]/.test(text[e-1])) e--; else if(c>o && /[）)]/.test(text[s])) s++; else if(o>c && /[（(]/.test(text[s])) s++; else break; }
      if(ok(text.slice(s,e))) runs.push([s,e]); }
    for(let k=runs.length-1;k>=0;k--){
      const [s,e]=runs[k], r=document.createRange();
      const at=(pos,isEnd)=>{ for(const [n,a,b] of map){ if(isEnd? (pos>a&&pos<=b) : (pos>=a&&pos<b)){ return [n,pos-a]; } } return null; };
      const A=at(s,false), B=at(e,true); if(!A||!B) continue;
      try{
        if(A[0].nodeType===3) r.setStart(A[0],A[1]); else r.setStartBefore(A[0]);
        if(B[0].nodeType===3) r.setEnd(B[0],B[1]); else r.setEndAfter(B[0]);
        const sp=document.createElement('span'); sp.className='eq'; r.surroundContents(sp);
      }catch(err){}
    }
  }
  window.__eqWrap=el=>{ try{ group(el); }catch(e){} };
  document.head.insertAdjacentHTML('beforeend','<style>.eq{white-space:nowrap}</style>');
})();

function budget(){
  const F=flowRows(), here=unitKeyAt(cur);
  const idx=F.rows.findIndex(r=>r.k===here);
  const left=F.rows.slice(Math.max(idx,0)).reduce((a,r)=>a+r.m,0);
  const el=T0?Math.round((Date.now()-T0)/60000):null;
  const remain=el==null?null:120-el;
  let tip='';
  if(remain!=null && left>remain){
    const over=left-remain, cand=SKIP_ORDER.filter(k=>!ROUTE.x.includes(k) && F.rows.slice(idx+1).some(r=>r.k===k));
    const coreSave=ROUTE.c?0:F.rows.slice(Math.max(idx,0)).reduce((a,r)=>a+(UMIN[r.k]?UMIN[r.k][0]-UMIN[r.k][1]:0),0);
    tip=`<div class="fx-warn">照目前路線會超出約 <b>${over}</b> 分鐘。`+
      (coreSave>0?`<button data-fx="core1">改成只講核心頁（約省 ${coreSave} 分）</button>`:'')+
      cand.slice(0,2).map(k=>`<button data-fx="skip" data-k="${k}">略過「${UNITS[UKEYS.indexOf(k)][0]}」（${UMIN[k][ROUTE.c?1:0]} 分）</button>`).join('')+`</div>`;
  }

}

/* ROUTE.p = { 單元代號: ['單元.第幾頁', …] }：只記有改過的單元。別的單元的頁是「複製一張插進來」，原單元照常有。 */
function pgDefault(k){ return (MODS[k]||[]).map((_,i)=>k+'.'+i); }
function pgList(k){
  const P=ROUTE.p||{}, own=pgDefault(k);
  let refs=Array.isArray(P[k])?P[k].slice():own.slice();
  own.forEach(r=>{ if(!refs.includes(r)) refs.push(r); });   /* 原單元新增的頁補在最後 */
  const u=UKEYS.indexOf(k), out=[];
  refs.forEach(ref=>{ const j=ref.lastIndexOf('.'), k2=ref.slice(0,j), i=+ref.slice(j+1), p=(MODS[k2]||[])[i]; if(!p) return;
    const isOwn=k2===k;
    out.push({ref,own:isOwn,k2,i,p,cp:isOwn?p:Object.assign({},p,{u,id:p.id+'@'+k,cpOf:ref})}); });
  return out;
}
